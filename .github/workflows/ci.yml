name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples/demo_app/logs
      - name: Tests
        run: pytest -q
      - name: MCP over stdio
        run: python tests/stdio_smoke.py examples/demo_app
      - name: Scanner benchmark on the demo app
        run: pytest -q -s tests/test_benchmark_demo.py
