[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harnessdoc"
version = "0.1.0"
description = "Measure what each successful task of your AI app costs — provider-neutral, deterministic, and CI-ready."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Harsh Chhabra" }]
keywords = ["llm", "cost", "tokens", "prompt-caching", "evals", "mcp", "claude-code", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
]
dependencies = ["typer>=0.12", "pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]  # MCP SDK v2 (MCPServer); v1's FastMCP API is not supported
dev = ["pytest>=8", "ruff>=0.5", "mcp>=2.3,<3", "anthropic>=2"]  # anthropic: real-SDK interceptor test

[project.scripts]
harnessdoc = "harnessdoc.cli:app"

[project.urls]
Homepage = "https://github.com/hchhabra1999/harnessdoc"
Issues = "https://github.com/hchhabra1999/harnessdoc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessdoc"]

[tool.hatch.build.targets.sdist]
include = ["src/harnessdoc", "tests", "docs", "examples", "skills", "scripts", ".github",
           "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "RELEASING.md", "pyproject.toml"]
exclude = [
  "examples/demo_app/logs/usage*.jsonl",  # generated demo logs
  "**/harnessdoc-experiment-*.json",       # local experiment results
  "**/harnessdoc-report.md",               # generated reports
  "**/__pycache__", "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
# B008: Typer Option()/Argument() defaults are the framework's intended pattern.
extend-ignore = ["B008"]
